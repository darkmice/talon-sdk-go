name: Go tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Test
        env:
          GOWORK: off
        run: go test -ldflags=-linkmode=external ./...
      - name: Test cgo-free Server client
        env:
          CGO_ENABLED: 0
          GOWORK: off
        run: go test ./server/... ./internal/serverprotocol
      - name: Vet
        env:
          GOWORK: off
        run: go vet ./...
